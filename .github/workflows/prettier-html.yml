name: Inspect generated HTML formatting (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout published HTML for inspection
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Prettier
        run: npm install -g prettier

      - name: Produce a review-only formatting diff
        run: |
          find . -type f -name "*.html" -not -path "./.git/*" -exec sed -i 's/<\/source>//g' {} +
          prettier --write '**/*.html'
          git diff -- . > html-formatting.patch
          echo "The published gh-pages branch was NOT modified."
          wc -l html-formatting.patch

      - name: Upload suggested edits (no push)
        uses: actions/upload-artifact@v4
        with:
          name: published-html-formatting-diff
          path: html-formatting.patch
          retention-days: 7
