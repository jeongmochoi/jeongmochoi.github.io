name: Update TOCs
# This workflow automatically updates the Table of Contents (TOC) in markdown files

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # OR "2" -> To retrieve the preceding commit.

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46
        with:
          files: ./*.md

      - name: Updated toc on all markdown changed files
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          curl https://raw.githubusercontent.com/george-gca/github-markdown-toc/main/gh-md-toc -o gh-md-toc
          chmod a+x gh-md-toc
          for file in ${ALL_CHANGED_FILES}; do
            # Check if the file is a markdown file
            if [[ "$file" != *.md ]]; then
              continue
            fi
            ./gh-md-toc --indent 2 --insert --no-backup --hide-footer $file
          done
          rm gh-md-toc

      - name: Open draft PR for changed table of contents
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-tocs
          delete-branch: true
          add-paths: "*.md"
          commit-message: "docs: refresh markdown table of contents"
          title: "자동 갱신: Markdown 목차"
          body: |
            Markdown 목차 자동 생성 결과입니다.
            공개 홈페이지에 자동 반영하지 않습니다. 내용과 빌드 검사를 확인한 후 별도로 승인해 주세요.
          draft: true
