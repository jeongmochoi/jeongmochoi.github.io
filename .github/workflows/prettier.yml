name: Prettier (changed files only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Check formatting of changed source files only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          mapfile -d '' -t candidates < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          files=()
          for file in "${candidates[@]}"; do
            case "$file" in
              *.md|*.markdown|*.liquid|*.html|*.js|*.json|*.yml|*.yaml|*.css|*.scss)
                files+=("$file")
                ;;
            esac
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed files require a Prettier check."
          else
            printf 'Checking: %s\n' "${files[@]}"
            npx prettier --check "${files[@]}"
          fi
