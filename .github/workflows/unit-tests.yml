name: Integration tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "assets/css/**"
      - "test/integration_*.sh"
      - "test/style_contract.js"
      - "package*.json"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comments-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Run style contract lint 🧷
        env:
          ALLOW_SITE_OVERRIDES: "true" # local layouts/includes are intentional on this personalized site
        run: npm run lint:style-contract

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      # Demo-only comments/Distill tests were removed with the unpublished samples.
      - name: Run plugin toggle integration test 🔌
        run: bash test/integration_plugin_toggles.sh

      - name: Run bootstrap compatibility integration test 🧩
        run: bash test/integration_bootstrap_compat.sh

      - name: Run upgrade CLI integration test ⬆️
        run: bash test/integration_upgrade_cli.sh

      - name: Run CSS minify integration test 🎨
        run: bash test/integration_css_minify.sh
